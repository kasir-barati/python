[project]
name = "strawberry-constraints-demo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "strawberry-graphql[asgi]>=0.243",
    "pydantic[email]>=2.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
