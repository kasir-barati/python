[alembic]
# %(here)s resolves relative to this file, not the caller's cwd, so
# `make db-migrate` works the same whether it's run from the repo root
# or from a Docker image that only has `shared/` and one service copied in.
script_location = %(here)s/migrations

# intentionally blank: shared/migrations/env.py reads it from the DATABASE_URL
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
