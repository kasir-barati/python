# Reference only — placeholder values. In a real cluster this is generated by a secrets manager
# (External Secrets, Sealed Secrets, ...), never committed as plain YAML.
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-config
type: Opaque
stringData:
  POSTGRES_USER: username
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: db-name
  PG_HOST: postgres.default.svc.cluster.local
  POSTGRES_PORT: "5432"

  RABBITMQ_HOST: rabbitmq.default.svc.cluster.local
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: change-me
  RABBITMQ_VHOST: "/"

  # Full connection string form of the RABBITMQ_* values above, for KEDA's TriggerAuthentication only —
  # the app itself never reads this key, it builds the same URL from the individual vars in config.py.
  RABBITMQ_URL: "amqp://guest:change-me@rabbitmq.default.svc.cluster.local:5672/%2F"
