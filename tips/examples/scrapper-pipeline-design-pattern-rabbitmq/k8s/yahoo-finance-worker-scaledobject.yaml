# Scales the yahoo-finance-worker Deployment on SymbolQueue depth, including to zero when empty.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: yahoo-finance-worker
spec:
  scaleTargetRef:
    name: yahoo-finance-worker
  minReplicaCount: 0
  maxReplicaCount: 4 # kept in sync with YahooFinanceWorker's `instances` by tools/render_k8s.py
  cooldownPeriod: 30 # seconds the queue must stay empty before scaling back to 0
  pollingInterval: 15
  triggers:
    - type: rabbitmq
      metadata:
        queueName: SymbolQueue
        mode: QueueLength
        value: "5" # target messages per replica
      authenticationRef:
        name: rabbitmq-trigger-auth
