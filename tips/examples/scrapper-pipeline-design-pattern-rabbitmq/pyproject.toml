[project]
name = "wiki-yahoo-scraper-rabbitmq"
version = "0.1.0"
description = "Pipes-and-filters scraper over RabbitMQ quorum queues: S&P 500 tickers -> Yahoo Finance prices -> Postgres"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pika>=1.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[dependency-groups]
# Only used by tools/render_k8s.py (a host-side script, never imported by src/ or run in a
# container) - excluded from the image via `uv sync --no-dev` in the Dockerfile.
dev = [
    "ruamel.yaml>=0.18",
]

[tool.uv]
package = false
