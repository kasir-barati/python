name: Update index

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '!index.md'
      - 'Makefile'
      - 'scripts/gen_nav.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate index.md
        run: make update_index

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- index.md _includes/nav_tree.html)" ]; then
            echo "index.md and nav are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md _includes/nav_tree.html
          git commit -m "chore: update index.md"
          git push
