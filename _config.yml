title: Python
email: kasir.barati@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome doc for Python. A very nice an practical one extracted from Python official documentation.
baseurl: "/python" # the repository name
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: kasir_barati
github_username: kasir-barati
plugins:
  - jekyll-relative-links
  - jekyll-remote-theme # add this line to the plugins list if you already have one
relative_links:
  enabled: true
  collections: true
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: dark
search_enabled: true
heading_anchors: true
# The sidebar is generated from the directory tree (scripts/gen_nav.py, see
# _includes/components/site_nav.html), so no markdown file needs front matter.
aux_links:
  GitHub:
    - https://github.com/kasir-barati/python
defaults:
  - scope: { path: "" }
    values: { layout: default }
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
include:
  - .github
exclude:
  - scripts
  - Makefile
